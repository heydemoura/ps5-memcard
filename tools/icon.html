<!doctype html>
<!-- The home screen / notification icon: the 3D card from src/card3d.js on the page's own
     background. Rendered to assets/icon0.png by tools/make-icon.cjs (make icon). -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; }
  /* Same colours and placement as body / body::before / body::after in src/ui.html. */
  #icon { position: relative; width: 512px; height: 512px; overflow: hidden; background: #05060a; }
  #icon::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(120,255,190,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(120,255,190,.14) 1px, transparent 1px);
    background-size: 44px 44px; background-position: 14px 14px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse at 50% 30%, #000 30%, transparent 75%); }
  #icon::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 15%, rgba(124,92,255,var(--a1)), transparent 40%),
                radial-gradient(circle at 85% 25%, rgba(57,255,159,var(--a2)), transparent 38%),
                radial-gradient(circle at 50% 100%, rgba(0,212,255,var(--a3)), transparent 45%); }
  #icon { --a1: .28; --a2: .18; --a3: .15; }
  #icon.bold { --a1: .5; --a2: .34; --a3: .3; }
  canvas { position: absolute; z-index: 2; left: 50%; top: 50%; width: 404px; height: 528px; transform: translate(-50%, -50%);
    filter: drop-shadow(0 18px 26px rgba(0,0,0,.55)) drop-shadow(0 0 34px rgba(57,255,159,.16)); }
</style>
<div id="icon"><canvas id="c" width="1116" height="1458"></canvas></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('bold')) document.getElementById('icon').classList.add('bold');
  window.mcIcons = new Map([['icon', { canvas: document.getElementById('c'), text: q.get('text') || '', mode: 'card', angle: +(q.get('angle') || -0.5),
    font: q.get('family') ? [q.get('style') || '700', q.get('family')] : null }]]);
</script>
<script type="module" src="/card3d.js"></script>
